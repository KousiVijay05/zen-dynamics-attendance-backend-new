<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="Zen & Dynamics — geofenced staff attendance and payroll" />
  <title>Zen &amp; Dynamics — Attendance</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- ?v= busts GitHub Pages' Cache-Control: max-age=600 on a fresh page
       load, so a hard refresh doesn't need to wait out a 10-minute-old
       cached copy. Bump this alongside sw.js's CACHE constant. -->
  <link rel="stylesheet" href="styles/tokens.css?v=11" />
  <link rel="stylesheet" href="styles/base.css?v=11" />
  <link rel="stylesheet" href="styles/components.css?v=11" />
  <link rel="stylesheet" href="styles/views.css?v=11" />

  <!-- There's no bundler (by design — see README), so js/app.js and everything
       it imports would otherwise load as a sequential discovery chain: the
       browser fetches app.js, parses it, discovers its imports, fetches
       those, discovers theirs, and so on — one network round trip per link
       in the chain. On a fast connection that's invisible; on a slow/high-
       latency mobile connection it's the difference between the app
       appearing in ~1s and taking 10+ seconds, and a feature whose file
       loads late in the chain (e.g. a tab's view module) can look "missing"
       simply because it hasn't arrived yet. These hints tell the browser to
       start fetching the whole module graph in parallel immediately instead
       of discovering it one file at a time. Keep this list in sync with
       sw.js's ASSETS (everything under js/ except storage-local.js /
       storage-gsheets.js, which are classic scripts, not ES modules). -->
  <link rel="modulepreload" href="js/app.js" />
  <link rel="modulepreload" href="js/core/config.js" />
  <link rel="modulepreload" href="js/core/store.js" />
  <link rel="modulepreload" href="js/domain/attendance.js" />
  <link rel="modulepreload" href="js/domain/auth.js" />
  <link rel="modulepreload" href="js/domain/excel.js" />
  <link rel="modulepreload" href="js/domain/geofence.js" />
  <link rel="modulepreload" href="js/domain/leave.js" />
  <link rel="modulepreload" href="js/domain/org.js" />
  <link rel="modulepreload" href="js/domain/payroll.js" />
  <link rel="modulepreload" href="js/domain/roster.js" />
  <link rel="modulepreload" href="js/events/handlers.js" />
  <link rel="modulepreload" href="js/storage/storage-api.js" />
  <link rel="modulepreload" href="js/ui/dom.js" />
  <link rel="modulepreload" href="js/ui/notify.js" />
  <link rel="modulepreload" href="js/ui/render.js" />
  <link rel="modulepreload" href="js/ui/components/brand.js" />
  <link rel="modulepreload" href="js/ui/components/monthOptions.js" />
  <link rel="modulepreload" href="js/ui/components/proximity.js" />
  <link rel="modulepreload" href="js/ui/components/syncStatus.js" />
  <link rel="modulepreload" href="js/ui/views/admin/index.js" />
  <link rel="modulepreload" href="js/ui/views/admin/leave.js" />
  <link rel="modulepreload" href="js/ui/views/admin/onsite.js" />
  <link rel="modulepreload" href="js/ui/views/admin/payroll.js" />
  <link rel="modulepreload" href="js/ui/views/admin/people.js" />
  <link rel="modulepreload" href="js/ui/views/admin/records.js" />
  <link rel="modulepreload" href="js/ui/views/admin/settings.js" />
  <link rel="modulepreload" href="js/ui/views/admin/shifts.js" />
  <link rel="modulepreload" href="js/ui/views/pin.js" />
  <link rel="modulepreload" href="js/ui/views/recover.js" />
  <link rel="modulepreload" href="js/ui/views/setup.js" />
  <link rel="modulepreload" href="js/ui/views/signin.js" />
  <link rel="modulepreload" href="js/ui/views/staff.js" />
  <link rel="modulepreload" href="js/utils/format.js" />
  <link rel="modulepreload" href="js/utils/geomath.js" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
  <div class="app" id="root">
    <div class="splash">
      <img src="icons/mark.png" alt="Zen & Dynamics" width="72" height="72" />
      <span>Loading Zen &amp; Dynamics…</span>
    </div>
  </div>

  <!-- Storage: localStorage (per device), the default. To store data in
       Google Sheets instead so every device sees the same records, swap
       this line for js/storage/storage-gsheets.js and follow
       google-apps-script/README-google-sheets.md. -->
  <!-- <script src="js/storage/storage-local.js"></script> -->
<script src="js/storage/storage-gsheets.js"></script>

  <script type="module" src="js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
    });
  }
</script>
</body>
</html>
